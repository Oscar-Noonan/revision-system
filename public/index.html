
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        .user {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .completed {
            text-decoration: line-through;
            color: grey;
        }

        input, button {
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>User List</h1>

    <ul id="user-list"></ul>

    <script>
        const list = document.getElementById("user-list");

        async function loadusers() {
            try {
                const response = await fetch("http://192.168.7.242:3000/api/users");

                if (!response.ok) {
                    throw new Error("Failed to fetch users");
                }

                const users = await response.json();

                list.innerHTML = "";

                users.forEach(user => {
                    const li = document.createElement("li");
                    li.className = "user";

                    const span = document.createElement("span");
                    span.textContent = user.email;

                    li.appendChild(span);
                    list.appendChild(li);
                });

            } catch (error) {
                console.error("Error loading users:", error);
            }
        }

        loadusers();
    </script>

</body>
</html>
